function savedRun(){try{return JSON.parse(localStorage.getItem('pxsoko2run'))}catch(e){return null}}

 LT++;if(tk!=MENU){tk=MENU;mus()}
 const r=savedRun(),cr=r&&r.S&&DF[r.S.df]&&r.L0?`<button class="card" onclick="resume()"><b>Continue run</b><span>${DF[r.S.df].n} · Floor ${r.S.d}</span></button>`:'';
 ov(`<h2>Endless Boxes</h2><p>Choose difficulty</p><div class="cards">${cr}`+DF.map((x,i)=>`<button class="card" onclick="go(${i})"><b>${x.n} · Best: Floor ${B[i]||0}</b><span>${x.d}</span></button>`).join('')+`</div><button onclick="help()">How to Play</button>`)
}

 const r=savedRun();if(!r)return start();
 S=r.S;S.over=0;S.rel=(S.rel||[]).filter(id=>POOL.some(p=>p.id==id));S.door=(S.door||[]).filter(k=>MODS[k]);L0=r.L0;L=JSON.parse(L0);L.M=(L.M||[]).filter(k=>MODS[k]);L0=JSON.stringify(L);H=[];armed=wa=false;VP=null;tk=-1;track();layout();hide();
 say('Run restored. This floor was restarted from the beginning.');draw();
}

 $('lv').innerHTML=`<b>${DF[S.df].n} · Floor ${S.d}${L.boss?' · BOSS':''}</b>`+(L.M.length?`<div class="mc">${L.M.map(k=>`<button class="mt" onclick="minfo('${k}')">${ic(MODS[k][2])} ${MODS[k][0]}</button>`).join('')}</div>`:'');
 $('hud').innerHTML=[['life',S.life],['undo',S.undo],['shoe',L.left],['pull',L.pull],['ham',L.ham],['shield',S.sh],['bag',S.coin]].filter(([k,v],i)=>v>0||i<3).map(([k,v])=>`<span class="${k=='shoe'&&L.left<=5?'low':''}">${ic(k)} ${v>90?'∞':v}</span>`).join('');
 $('rel').innerHTML=[...new Set(S.rel)].map(id=>`<button class="ib r${POOL.find(p=>p.id==id).r}" onclick="rinfo('${id}')">${ico(id)}${cnt(id)>1?'×'+cnt(id):''} ${POOL.find(p=>p.id==id).n}</button>`).join('');
 $('bp').hidden=!(cnt('pull')||cnt('fury')||cnt('rope'));$('bp').textContent='Pull ×'+(L.pull>90?'∞':L.pull);$('bp').classList.toggle('on',armed);$('bu').textContent='Undo ×'+S.undo;$('bd').hidden=!cnt('dice')||!!S.dd;$('bw').hidden=!cnt('swap');$('bw').textContent='Swap ×'+(L.swp|0);$('bw').classList.toggle('on',wa);
}
const GL=[[[1,0],[0,1],[1,1],[2,1],[1,2]],[[0,0],[2,0],[1,1],[0,2],[2,2]],[[0,0],[1,0],[2,0],[0,2],[1,2],[2,2]]];
function tile(x,y){
 const t=L.tl?L.tl[y][x]:0,w=((L.wc&&L.wc[y*L.W+x])|0),l=lm(L,x,y),X=x*8,Y=y*8;
 if(ho(L,x,y)){g.fillStyle='#140e1e';g.fillRect(X,Y,8,8);return}
 if(t==1)g.drawImage(SP.ice,X,Y);
 else if(t==8)g.drawImage(SP.mud,X,Y);
 else if(t==2)g.drawImage(L.gate?SP.swt1:SP.swt,X,Y);
 else if(t==3){if(!L.gate)g.drawImage(SP.gate,X,Y)}
 else if(t==4){const i=L.tel.findIndex(q=>q.some(c=>c[0]==x&&c[1]==y));g.drawImage(i==1?SP.tele2:SP.tele,X,Y)}
 else if(t==6||t==7){const up=(t==6&&(L.n|0)%2==0)||(t==7&&(L.n|0)%2==1);g.drawImage(up?SP.spk:SP.spk0,X,Y)}
 if(t==5||(l&&w>0))g.drawImage(w>0&&w>=l-1?SP.crk2:SP.crk,X,Y);
}
const gly=(t,x,y,c)=>{g.fillStyle=c;GL[t].forEach(([a,b])=>g.fillRect(x+a,y+b,1,1))};
function frame(t){
 requestAnimationFrame(frame);
 if(!L.m||!L.bx)return;
 const mk=L.goals.some(q=>q[2]);
 if(!VP||VP.b.length!=L.bx.length)VP={p:[L.px,L.py],b:L.bx.map(b=>[b[0],b[1]])};
 VP.p[0]+=(L.px-VP.p[0])*.45;VP.p[1]+=(L.py-VP.p[1])*.45;
 L.bx.forEach((b,i)=>{VP.b[i][0]+=(b[0]-VP.b[i][0])*.45;VP.b[i][1]+=(b[1]-VP.b[i][1])*.45});
 for(let y=0;y<L.H;y++)for(let x=0;x<L.W;x++){
  if(L.m[y][x])g.drawImage(SP.wall,x*8,y*8);
  else{g.fillStyle=(x+y)%2?'#d4c59a':'#cbbb8e';g.fillRect(x*8,y*8,8,8);tile(x,y);const a=L.ar[y][x];if(a){g.save();g.globalAlpha=.8;g.translate(x*8+4,y*8+4);g.rotate((a-1)*Math.PI/2);g.drawImage(SP.arr,-4,-4);g.restore()}}
 }
 if(!(L.M.includes('amnesia')&&(L.n|0)>=6))L.goals.forEach(([x,y,k])=>{g.drawImage(SP['goal'+(k||'')],x*8,y*8);if(mk)gly(k||0,x*8+2,y*8+2,'#2a1f1a')});
 L.bx.forEach((b,i)=>{const X=Math.round(VP.b[i][0]*8),Y=Math.round(VP.b[i][1]*8),bl=L.M.includes('blind')&&Math.max(Math.abs(b[0]-L.px),Math.abs(b[1]-L.py))>1,bt=b[2]==3||bl?0:(b[2]||0);g.drawImage(SP['box'+(bt||'')],X,Y);if(mk&&!bl)gly(bt,X+2,Y+2,'#f6efdc');if(L.goals.some(q=>q[0]==b[0]&&q[1]==b[1]&&(cnt('prism')||q[2]==b[2]))){g.fillStyle='#7be35a';mk?g.fillRect(X+1,Y+1,2,2):g.fillRect(X+3,Y+3,2,2)}});
 g.drawImage(SP.me,Math.round(VP.p[0]*8),Math.round(VP.p[1]*8)+(Math.sin(t/180)>0?0:1));
 P=P.filter(q=>q.l>0);P.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.06;q.l--;g.fillStyle=q.c;g.fillRect(q.x|0,q.y|0,1,1)});
 const foggy=(L.M.includes('fog')||L.M.includes('dark'))&&!cnt('scout')&&!cnt('focus');
 if(foggy){
  const rad=L.M.includes('dark')?2:3,fx=Math.round(VP.p[0]),fy=Math.round(VP.p[1]);
  for(let y=0;y<L.H;y++)for(let x=0;x<L.W;x++){const d=Math.max(Math.abs(x-fx),Math.abs(y-fy));
   if(d>rad){g.globalAlpha=1;g.fillStyle='#140e1e';g.fillRect(x*8,y*8,8,8)}
   else if(d==rad){g.globalAlpha=.5;g.fillStyle='#140e1e';g.fillRect(x*8,y*8,8,8)}}
  g.globalAlpha=1;
  if(cnt('compass')){const cc=['#f08a2b','#4fc3d9','#e58fd0','#a9b2c4'],inf=(x,y)=>Math.max(Math.abs(x-fx),Math.abs(y-fy))>=rad;
   L.goals.forEach(([x,y,k])=>{if(!inf(x,y))return;g.fillStyle=cc[k||0];for(let a=2;a<6;a++)for(let b=2;b<6;b++)if(a==2||a==5||b==2||b==5)g.fillRect(x*8+a,y*8+b,1,1)});
   L.bx.forEach((b,i)=>{if(!inf(Math.round(VP.b[i][0]),Math.round(VP.b[i][1])))return;g.fillStyle=cc[b[2]==3?3:(b[2]||0)];g.fillRect(Math.round(VP.b[i][0]*8)+3,Math.round(VP.b[i][1]*8)+3,2,2)})}}
}
